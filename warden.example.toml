# cargo-warden configuration file example
# Place this file as `warden.toml` or `.warden.toml` in your project root,
# or define it inside `Cargo.toml` under `[workspace.metadata.warden]`.

[dag]
# Source roots to scan for modules
roots = ["crates/my-core/src"]
# Modules that must not be depended on by siblings (e.g. assembly/boot points)
forbid_imports = ["bootstrap"]

[ci_parity]
# Path to CI workflow file relative to repository root
workflow = ".github/workflows/ci.yml"
# Test command patterns to scan for member names
test_patterns = ["nextest", "llvm-cov"]
# Packages to exclude from parity requirements (e.g. fuzz targets or external tools)
ignore_crates = ["fuzz"]
# Optional crates expected in coverage fan-out loops
fanout_crates = []

[slint_theme]
# Directory containing .slint files
ui_dir = "crates/my-app/ui"
out_file = "crates/my-app/ui/theme.slint"
# Hex colors permitted to stay as raw literals
unchanged_colors = [
    "ffffff", "000000", "6b7280", "ffffff55"
]

[i18n]
# Directory containing `<locale>/LC_MESSAGES/<domain>.po`
lang_dir = "crates/my-app/lang"
out_file = "crates/my-app/src/i18n/catalog.rs"
domain = "my-app"
locales = ["en", "zh_CN"]

[complexity]
# Maximum cognitive complexity score allowed per function/method
max = 25
# Directories to scan
paths = ["crates", "src"]
# Skip test files (*_test.rs, tests/, etc.)
ignore_tests = true
ignore = ["target"]

[file_length]
# Maximum allowed line count
max_lines = 800
# File extensions to check
extensions = ["rs", "slint"]
paths = ["crates", "src"]
ignore = ["target", "tests", "lang"]

[check]
# Optional Cargo toolchain checks during `cargo warden check`
fmt = true
clippy = false
doc = false

[gate]
# Run configured static checks before Cargo steps (default: true)
include_checks = true
# Pinned toolchain for fmt parity with CI (optional)
# rustfmt_toolchain = "1.85.0"

[[gate.test_groups]]
name = "core"
packages = ["my-types", "my-core"]
features = []

[[gate.test_groups]]
name = "app"
packages = ["my-app"]
features = []
