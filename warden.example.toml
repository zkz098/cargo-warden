# cargo-warden configuration file example
# Place this file as `warden.toml` or `.warden.toml` in your project root,
# or define it inside `Cargo.toml` under `[workspace.metadata.warden]`.

# Optional baseline file for gradual adoption (capture via `cargo warden baseline generate`)
# baseline = "warden-baseline.json"

[dag]
# Source roots to scan for modules
roots = ["crates/my-core/src"]
# Modules that must not be depended on by siblings (e.g. assembly/boot points)
forbid_imports = ["bootstrap"]

# Optional layered architecture rules
# [[dag.layers]]
# name = "domain"
# modules = ["domain", "core::domain"]
# allow = []
#
# [[dag.layers]]
# name = "app"
# modules = ["app"]
# allow = ["domain", "infra"]
# deny = ["bootstrap"]

# Optional workspace crate-level dependency boundary rules (`cargo warden dag --workspace`)
# [dag.workspace]
# forbid_deps = ["my-bootstrap"]
# include_dev_dependencies = false
# check_version_conflicts = false
#
# [[dag.workspace.layers]]
# name = "domain"
# crates = ["my-domain", "my-types"]
# allow = []
#
# [[dag.workspace.layers]]
# name = "app"
# crates = ["my-app"]
# allow = ["domain", "infra"]
# deny = ["my-bootstrap"]

[ci_parity]
# Path to CI workflow file relative to repository root
workflow = ".github/workflows/ci.yml"
# Test command patterns to scan for member names
test_patterns = ["nextest", "llvm-cov"]
# Packages to exclude from parity requirements (e.g. fuzz targets or external tools)
ignore_crates = ["fuzz"]
# Optional crates expected in coverage fan-out loops
fanout_crates = []

[slint_theme]
# Directory containing .slint files
ui_dir = "crates/my-app/ui"
out_file = "crates/my-app/ui/theme.slint"
# Optional design token definition (TOML or W3C DTCG `.tokens.json`)
# theme_def = "tokens.tokens.json"
# Hex colors permitted to stay as raw literals
unchanged_colors = [
    "ffffff", "000000", "6b7280", "ffffff55"
]
# Optional glob/prefix exclusions under ui_dir (`out_file` is always excluded)
# exclude = ["generated/**"]
# verify_generated = true
# check_unknown_tokens = true
# check_unused_tokens = false

# [slint_theme.rules]
# color = true
# spacing = true
# radius = true
# typography = true
# duration = true
# allowed_lengths = ["0px", "1px"]
# allowed_durations = ["0ms", "0s"]
# spacing_grid = 4

[i18n]
# Directory containing `<locale>/LC_MESSAGES/<domain>.po`
lang_dir = "crates/my-app/lang"
out_file = "crates/my-app/src/i18n/catalog.rs"
domain = "my-app"
locales = ["en", "zh_CN"]
# Source directories to scan for `@tr(...)` (Slint) and `tr(...)` / `tr!(...)` (Rust) keys
# source_dirs = ["crates/my-app/ui", "crates/my-app/src"]
# tr_macros = ["tr", "t", "gettext"]
# Fail on empty msgstr, #, fuzzy entries, or missing cross-locale keys (default: false)
strict = false
# Verify placeholder consistency ({}, {0}, {name}, %s) between msgid and msgstr (default: true)
check_placeholders = true
# Flag .po entries no longer referenced in source_dirs (default: false)
check_unused = false
# Respect .gitignore rules when scanning source_dirs (default: true)
respect_gitignore = true

[complexity]
# Maximum cognitive complexity score allowed per function/method
max = 25
# Optional maximum lines and nesting depth per function/method
# max_function_lines = 120
# max_nesting = 5
# Directories to scan
paths = ["crates", "src"]
# Skip test files (*_test.rs, tests.rs, tests/ directory)
ignore_tests = true
ignore = ["target"]
# Respect .gitignore rules (default: true)
respect_gitignore = true

# Optional path-scoped overrides
# [[complexity.overrides]]
# paths = ["crates/legacy/**"]
# max = 40
# max_function_lines = 200
# max_nesting = 7

[file_length]
# Maximum allowed line count
max_lines = 800
# File extensions to check
extensions = ["rs", "slint"]
paths = ["crates", "src"]
ignore = ["target", "tests", "lang"]
# Counting mode: "physical" (all lines) or "effective" (SLOC, ignoring blanks and comments)
mode = "physical"
# Respect .gitignore rules (default: true)
respect_gitignore = true

# Optional path-scoped overrides
# [[file_length.overrides]]
# paths = ["crates/ui/**"]
# max_lines = 1200
# mode = "effective"

[check]
# Optional Cargo toolchain checks during `cargo warden check`
fmt = true
clippy = false
doc = false
# Run independent static checks in parallel (default: true)
parallel = true
# Emit warnings for unused inline `// warden:allow(...)` directives (default: true)
warn_unused_suppressions = true

[gate]
# Run configured static checks before Cargo steps (default: true)
include_checks = true
# Run consecutive read-only steps (fmt, machete, deny, audit, read_only custom steps) in parallel (default: true)
parallel = true
# Pinned toolchain for fmt parity with CI (optional)
# rustfmt_toolchain = "1.85.0"

[[gate.test_groups]]
name = "core"
packages = ["my-types", "my-core"]
features = []

[[gate.test_groups]]
name = "app"
packages = ["my-app"]
features = []

# Optional custom gate steps (with optional read_only parallelism and --fix overrides)
# [[gate.custom_steps]]
# name = "license-header"
# program = "cargo"
# args = ["about", "check"]
# cargo_tool = "about"        # optional `cargo <tool> --version` check before running
# read_only = true            # eligible for parallel execution with adjacent read-only steps
# full_only = false           # set true to run only with `cargo warden gate --full`
# fix_args = ["about", "generate"]
#
# [[gate.custom_steps]]
# name = "schema-lint"
# command = "npm run lint:schema"
# fix_command = "npm run lint:schema -- --fix"
# cwd = "web"
# env = { NODE_ENV = "test" }
